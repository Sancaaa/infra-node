---
# The ssh_hardening role: no root login and no password login.
#
# It is the one role that can lock a person out, so the dashboard applies it
# only to a host where it has just logged in with its key, and never turns off
# root login on a host it logs in to as root. The assert below is the last line
# of defence for the same rule. Every file is checked with "sshd -t" before it is
# put in place, so a mistake cannot stop sshd from starting at the next boot.

- name: Stop if this would lock the dashboard out
  ansible.builtin.assert:
    that: not ((ssh_disable_root | bool) and ansible_user == 'root')
    fail_msg: "The dashboard logs in to this host as root, so turning off root login would lock it out. Add a user with the users role, edit the host to log in as that user, then apply this role."
    quiet: true

- name: Create the folder /etc/ssh/sshd_config.d
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Make sshd read /etc/ssh/sshd_config.d before its other settings
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*Include\s+/etc/ssh/sshd_config\.d/\*\.conf\s*$'
    line: 'Include /etc/ssh/sshd_config.d/*.conf'
    insertbefore: BOF
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Write the sshd hardening settings
  ansible.builtin.template:
    src: hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-infra-manager.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  when: (ssh_disable_root | bool) or (ssh_disable_password | bool)
  notify: Reload sshd

- name: Remove the sshd hardening settings
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/10-infra-manager.conf
    state: absent
  when: not ((ssh_disable_root | bool) or (ssh_disable_password | bool))
  notify: Reload sshd
